<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
<script src="assets/data.js?v=3"></script>
<title>E-shop | Maison Wafa</title>
<meta name="description" content="Tous les articles de Maison Wafa : décoration marocaine, art de la table, paniers, textile, bien-être et bijoux.">
<style>
  .cat-tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 40px; }
  .cat-tiles a { position: relative; aspect-ratio: 1; overflow: hidden; text-decoration: none; color: #fff; }
  .cat-tiles img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s; }
  .cat-tiles a::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  .cat-tiles span { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; text-align: center; font-family: Commissioner, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: 6px; }
  .cat-tiles a:hover img { transform: scale(1.06); }
  .shop .grid { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 1000px) { .cat-tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px) { .shop .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body data-page="boutique">
<main class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div class="page-head"><h1 id="h1">E-shop</h1><p id="intro"></p></div>
  <div class="cat-tiles" id="tiles"></div>
  <div class="shop">
    <aside class="side" id="side">
      <div class="box">
        <h3>Catégories</h3>
        <ul id="cats"></ul>
      </div>
      <div class="box">
        <h3>Fabrication</h3>
        <label class="chk"><input type="checkbox" id="fm"> Fait main uniquement</label>
      </div>
      <div class="box">
        <h3>Prix maximum</h3>
        <input type="range" id="max" min="5" max="60" step="1" aria-label="Prix maximum">
        <div class="range-val"><span>5 €</span><span id="maxVal"></span></div>
      </div>
      <div class="box" id="finBox">
        <h3>Finition (bijoux)</h3>
        <label class="chk"><input type="checkbox" value="Dorée" class="fin"> Dorée</label>
        <label class="chk"><input type="checkbox" value="Argentée" class="fin"> Argentée</label>
      </div>
      <button class="link" id="reset">Effacer les filtres</button>
    </aside>
    <div>
      <div class="toolbar">
        <button class="btn filters-btn" id="filtersBtn" aria-expanded="false">Filtrer</button>
        <span class="n" id="n"></span>
        <label class="sort">Trier par
          <select id="sort">
            <option value="pop">Pertinence</option>
            <option value="new">Nouveautés</option>
            <option value="asc">Prix croissant</option>
            <option value="desc">Prix décroissant</option>
            <option value="az">Nom, A à Z</option>
          </select>
        </label>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <div class="more" id="moreBox"><button class="btn" id="moreBtn">Afficher plus d'articles</button></div>
    </div>
  </div>
</main>
<script src="assets/app.js?v=3"></script>
<script>
const st = {
  cat: param("cat") || "", q: param("q") || "", fm: param("fm") === "1",
  max: 60, fin: [], sort: param("sort") || (param("q") ? "pop" : "pop"), shown: 9,
};
const INTRO = {
  "": "Toutes nos pièces, choisies une par une auprès d'artisans de tout le Maroc.",
  deco: "Lanternes, objets et pièces qui changent une pièce.",
  vaisselle: "Assiettes, bols et tajines en céramique et terre cuite.",
  paniers: "Paniers tressés à la main, pour le marché ou le rangement.",
  textiles: "Rideaux et voilages aux matières naturelles.",
  bienetre: "Huile d'argan, henné, ghassoul, eau de rose : les soins du hammam.",
  bijoux: "Bijoux fins en acier inoxydable, finition dorée ou argentée.",
};
const TILE_PH = { deco: "1505576391880-b3f9d713dc4f", vaisselle: "1553523292-1140e57d4f87", paniers: "1659520709425-31b547254b59", textiles: "1682421938316-4b186e25174c", bienetre: "1740744931699-11d1db68c0d4", bijoux: "1783541507490-edb026e2a961" };

const url = () => {
  const u = new URLSearchParams();
  if (st.cat) u.set("cat", st.cat); if (st.q) u.set("q", st.q); if (st.fm) u.set("fm", "1"); if (st.sort !== "pop") u.set("sort", st.sort);
  history.replaceState(null, "", "boutique.html" + (u.toString() ? "?" + u : ""));
};
const base = () => st.q ? search(st.q) : PRODUCTS;
const list = () => {
  let r = base().filter(p => (!st.cat || p.cat === st.cat) && (!st.fm || p.fm) && (p.price == null || p.price <= st.max)
    && (!st.fin.length || (p.specs || []).some(s => s[0] === "Finition" && st.fin.includes(s[1]))));
  const k = { asc: (a, b) => (a.price ?? 999) - (b.price ?? 999), desc: (a, b) => (b.price ?? 0) - (a.price ?? 0), az: (a, b) => a.name.localeCompare(b.name, "fr"),
    new: (a, b) => ((b.isNew || b.tag === "Nouveau") ? 1 : 0) - ((a.isNew || a.tag === "Nouveau") ? 1 : 0) }[st.sort];
  return k ? [...r].sort(k) : r;
};

function draw() {
  const r = list();
  const title = st.q ? `Résultats pour « ${st.q} »` : st.cat ? NAMES[st.cat] : "E-shop";
  document.title = title + " | Maison Wafa";
  $("#h1").textContent = title;
  $("#intro").textContent = st.q ? "" : INTRO[st.cat] || "";
  $("#crumbs").innerHTML = `<a href="index.html">Accueil</a> / <a href="boutique.html">E-shop</a>${st.cat ? ` / <span>${NAMES[st.cat]}</span>` : ""}${st.q ? ` / <span>Recherche</span>` : ""}`;
  $("#tiles").innerHTML = st.cat || st.q ? "" : CAT_ORDER.map(c => `<a href="boutique.html?cat=${c}">${img(TILE_PH[c], NAMES[c], 400, 400)}<span>${NAMES[c]}</span></a>`).join("");
  $("#cats").innerHTML = `<li><a href="#" data-c="" aria-current="${!st.cat}">Tout <span>${base().length}</span></a></li>` + CAT_ORDER.map(c => `<li><a href="#" data-c="${c}" aria-current="${st.cat === c}">${NAMES[c]} <span>${base().filter(p => p.cat === c).length}</span></a></li>`).join("");
  $("#fm").checked = st.fm; $("#max").value = st.max; $("#maxVal").textContent = st.max >= 60 ? "60 € et +" : st.max + " €"; $("#sort").value = st.sort;
  $("#finBox").hidden = !(st.cat === "bijoux" || st.cat === "");
  $("#n").textContent = r.length + (r.length > 1 ? " articles" : " article");
  const chips = [];
  if (st.q) chips.push(["q", `Recherche : ${st.q}`]);
  if (st.fm) chips.push(["fm", "Fait main"]);
  if (st.max < 60) chips.push(["max", `Jusqu'à ${st.max} €`]);
  st.fin.forEach(f => chips.push(["fin:" + f, f]));
  $("#chips").innerHTML = chips.map(([k, t]) => `<button data-chip="${k}" aria-label="Enlever le filtre ${esc(t)}">${esc(t)} ×</button>`).join("");
  $("#grid").innerHTML = r.length ? r.slice(0, st.shown).map(card).join("")
    : `<div class="no-result" style="grid-column:1/-1"><h2>Aucun article trouvé</h2><p>Essayez un autre mot, ou enlevez un filtre.</p><p style="margin-top:20px"><a class="btn" href="boutique.html">Voir tout l'e-shop</a></p></div>`;
  $("#moreBox").hidden = r.length <= st.shown;
  url();
}

$("#cats").addEventListener("click", e => { const a = e.target.closest("[data-c]"); if (!a) return; e.preventDefault(); st.cat = a.dataset.c; st.shown = 9; draw(); });
$("#fm").addEventListener("change", e => { st.fm = e.target.checked; draw(); });
$("#max").addEventListener("input", e => { st.max = +e.target.value; draw(); });
$$(".fin").forEach(c => c.addEventListener("change", () => { st.fin = $$(".fin").filter(x => x.checked).map(x => x.value); draw(); }));
$("#sort").addEventListener("change", e => { st.sort = e.target.value; draw(); });
$("#moreBtn").addEventListener("click", () => { st.shown += 9; draw(); });
$("#reset").addEventListener("click", () => { Object.assign(st, { q: "", fm: false, max: 60, fin: [] }); $$(".fin").forEach(x => x.checked = false); $$(".search input").forEach(i => i.value = ""); draw(); });
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-chip]"); if (!b) return;
  const k = b.dataset.chip;
  if (k === "q") { st.q = ""; $$(".search input").forEach(i => i.value = ""); } else if (k === "fm") st.fm = false; else if (k === "max") st.max = 60;
  else { const f = k.slice(4); st.fin = st.fin.filter(x => x !== f); $$(".fin").forEach(x => { if (x.value === f) x.checked = false; }); }
  draw();
});
$("#filtersBtn").addEventListener("click", e => e.currentTarget.setAttribute("aria-expanded", $("#side").classList.toggle("open")));
draw();
</script>
</body>
</html>
