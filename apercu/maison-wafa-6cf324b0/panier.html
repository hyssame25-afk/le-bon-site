<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
<script src="assets/data.js?v=3"></script>
<title>Mon panier | Maison Wafa</title>
</head>
<body data-page="panier">
<main class="wrap">
  <div class="crumbs"><a href="index.html">Accueil</a> / <span>Mon panier</span></div>
  <div class="page-head"><h1>Mon panier</h1></div>
  <div id="cart"></div>
  <section style="padding-top:0" id="ideasBox">
    <div class="row-head"><h2>Pour compléter</h2></div>
    <div class="grid" id="ideas"></div>
  </section>
</main>
<script src="assets/app.js?v=3"></script>
<script>
let promo = "";
function draw() {
  const c = getCart(), sub = cartSub();
  if (!c.length) {
    $("#cart").innerHTML = `<div class="no-result"><h2>Votre panier est vide</h2><p>Parcourez la boutique et ajoutez vos coups de cœur.</p><p style="margin-top:22px"><a class="btn btn-dark" href="boutique.html">Découvrir l'e-shop</a></p></div>`;
  } else {
    const disc = promo ? Math.round(sub * 10) / 100 : 0;
    $("#cart").innerHTML = `<div class="cart-page">
      <div>
        ${shipBar(sub).replace('class="ship-bar"', 'class="ship-bar" style="padding:0 0 18px"')}
        <div class="cart-table">${c.map(({ id, q }) => { const p = byId(id); return `<div class="line">
          <a class="mini" href="produit.html?id=${id}">${img(p.ph[0], p.name, 180, 225)}</a>
          <div><h3><a href="produit.html?id=${id}">${esc(p.name)}</a></h3><small>${NAMES[p.cat]} · ${euro(p.price)}</small>${p.fm ? `<br><small>Fait main</small>` : ""}</div>
          <span class="qty"><button data-q="${id}" data-d="-1" aria-label="Moins">−</button><output>${q}</output><button data-q="${id}" data-d="1" aria-label="Plus">+</button></span>
          <div class="end">${euro((p.price || 0) * q)}<button class="rm" data-rm="${id}">Retirer</button></div>
        </div>`; }).join("")}</div>
        <p style="margin-top:22px"><a href="boutique.html" class="link">‹ Continuer mes achats</a></p>
      </div>
      <div class="summary">
        <h2>Récapitulatif</h2>
        <div class="total"><span>Sous-total</span><span>${euro(sub)}</span></div>
        ${disc ? `<div class="total"><span>Code ${esc(promo)} (-10 %)</span><span>-${euro(disc)}</span></div>` : ""}
        <div class="total"><span>Livraison</span><span>${sub >= FREE_FROM ? "Offerte" : "Dès " + euro(SHIPPING[0].price)}</span></div>
        <div class="total big"><span>Total</span><span>${euro(sub - disc + (sub >= FREE_FROM ? 0 : SHIPPING[0].price))}</span></div>
        <form class="promo" id="promo"><input placeholder="Code promo" aria-label="Code promo" value="${esc(promo)}"><button>OK</button></form>
        <small style="color:var(--muted);font-family:Commissioner,sans-serif;font-size:12px">Pour tester : BIENVENUE (code d'exemple)</small>
        <a class="btn btn-dark" href="commande.html">Passer la commande</a>
        <div class="pay-icons" style="justify-content:center;color:var(--muted)"><span>CB</span><span>Visa</span><span>Mastercard</span><span>Virement</span></div>
      </div>
    </div>`;
    $("#promo").onsubmit = e => {
      e.preventDefault();
      const v = $("input", e.target).value.trim().toUpperCase();
      if (v === "BIENVENUE") { promo = v; store.set("mw_promo", v); toast("Code appliqué : -10 %"); draw(); } else toast("Ce code n'existe pas");
    };
  }
  const inCart = c.map(l => l.id);
  $("#ideas").innerHTML = PRODUCTS.filter(p => !inCart.includes(p.id) && p.price && p.price <= 25).slice(0, 4).map(card).join("");
}
promo = store.get("mw_promo", "");
document.addEventListener("cart", draw);
draw();
addEventListener("storage", draw);
document.addEventListener("click", e => { if (e.target.closest("[data-add]")) setTimeout(draw, 0); });
</script>
</body>
</html>
